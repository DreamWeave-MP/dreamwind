# DreamWind as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `dreamwind-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "aca6a4b0-f8b2-44a9-9cc4-55ef3c9d83f8"
slug = "dreamwind"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

# `application` releases it as a program too: CI packs the workspace into `dreamwind.jsw`, which
# `jess install org.dreamweave.dreamwind` installs, and a jess carrying it for each platform below,
# which runs without jess installed. The site's workflow names it with jess_application.
[package]
format = "jpk"
jess = "org.dreamweave.dreamwind"
application = "dreamwind"

[[platforms]]
os = "windows"
arch = "x86_64"

[[platforms]]
os = "macos"
arch = "x86_64"

[[platforms]]
os = "macos"
arch = "aarch64"

[[platforms]]
os = "linux"
arch = "x86_64"

[[releases]]
version = "0.2.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."

[[releases]]
version = "0.3.0"
date = 2026-10-23
summary = "DreamWind ships as a program: a download for Windows, macOS and Linux that runs without jess, or `jess install org.dreamweave.dreamwind`. It gains `sql` and `workbench`, and its tools find OpenMW's own configuration."
added = [
    "DreamWind is released as an application: `dreamwind.jsw`, which `jess install org.dreamweave.dreamwind` installs onto your PATH, and a standalone `dreamwind` for Windows x86_64, macOS x86_64 and ARM64, and Linux x86_64.",
    "`dreamwind sql`: SQL over a load order's content files and records, its VFS, a plugin, and a NIF, printed as a table, JSON or YAML (dreamwind-sql 0.2).",
    "`dreamwind workbench`: a review of an OpenMW Lua mod's scripts against OpenMW's Lua API (openmw-workbench 0.7).",
]
changed = [
    "vfstool, doctor, tes3merge, merged-lands and s3lightfixes read OpenMW's own openmw.cfg when neither `--config` nor OPENMW_CONFIG names one.",
]

[[releases]]
version = "0.3.1"
date = 2026-10-24
summary = "`dreamwind workbench` no longer reports `self.ATTACK_TYPE` and nearby's enum tables as engine-internal, and each platform's download goes to its own Nexus Mods file group."
fixed = [
    "`dreamwind workbench` (openmw-workbench 0.7.1) treats `self.ATTACK_TYPE`, `nearby.NAVIGATOR_FLAGS`, `nearby.COLLISION_SHAPE_TYPE` and `nearby.FIND_PATH_STATUS` as the public API they are.",
]

[[releases]]
version = "0.3.2"
date = 2026-10-24
summary = "`dreamwind nif-assets check` over a whole mods folder no longer fails with `table overflow` while writing its report."
fixed = [
    "`dreamwind nif-assets` (nif-assets 0.1.1) writes `check`, `info` and `fix` reports a file at a time, and the program is built on jess 0.2.2, whose JSON and YAML writers no longer overflow a table on a document of millions of lines.",
]
