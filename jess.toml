manifest_version = 1

[package]
id = "org.dreamweave.dreamwind"
version = "0.2.0"
jess_api = "1"
default_target = "dreamwind"
include = ["src"]
tests = ["tests/run.luau"]

# DreamWind is the packages below under one name. Their modules are theirs to require, each under
# its own scope; nothing is exported under `@dreamwind/` any more.
[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.tes3cmd" = "0.1"
"org.dreamweave.tes3conv" = "0.1"
"org.dreamweave.tes3-saves" = "0.1"
"org.dreamweave.nif" = "0.1"
"org.dreamweave.dream-archive" = "0.1"
"org.dreamweave.dream-archivetool" = "0.1"
"org.dreamweave.vfs" = "0.1"
"org.dreamweave.vfstool" = "0.1"
"org.dreamweave.openmw-config" = "0.1"
"org.dreamweave.openmw" = "0.1"
"org.dreamweave.dream-ini" = "0.1"
"org.dreamweave.openmw-import-morrowind" = "0.1"
"org.dreamweave.merge-to-master" = "0.1"
"org.dreamweave.add-vanilla-refs" = "0.1"
"org.dreamweave.starwind" = "0.1"
"org.dreamweave.load-order" = "0.1"
"org.dreamweave.s3lightfixes" = "0.1"
"org.dreamweave.merged-lands" = "0.1"
"org.dreamweave.tes3merge" = "0.1"

[modules]
"@dreamwind" = "src/init.luau"

# The module is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. It requires a tool only when that tool is named, and the layer
# requires each one it can name.

[[layer]]
id = "dreamwind.core"
requires = ["vfstool.core", "starwind.core", "s3lightfixes.core", "merged-lands.core", "tes3merge.core"]
exports = ["@dreamwind"]

# The command line itself: `src/main.luau` hands its arguments to `@dreamwind`. It can do what the
# tools it dispatches to can, so its capabilities are the union of what their own targets declare,
# each in its own manifest: `vfstool` (filesystem.read, filesystem.write, process.environment,
# process.spawn), `starwind` (filesystem.read, filesystem.write), and `s3lightfixes`,
# `merged-lands`, and `tes3merge` (filesystem.read, filesystem.write, process.environment each).
[targets.dreamwind]
kind = "command"
command = "dreamwind"
entry = "src/main.luau"
capabilities = ["filesystem.read", "filesystem.write", "process.environment", "process.spawn"]
