manifest_version = 1

[package]
id = "org.dreamweave.dreamwind"
version = "0.3.2"
jess_api = "1"
default_target = "dreamwind"
include = ["src", "tests"]
tests = ["tests/run.jsl", "tests/style.jsl"]

# DreamWind is the packages below under one name. Their modules are theirs to require, each under
# its own scope; nothing is exported under `@dreamwind/` any more.
[dependencies]
"org.dreamweave.esm" = "0.1"
"org.dreamweave.tes3cmd" = "0.1"
"org.dreamweave.tes3conv" = "0.1"
"org.dreamweave.tes3-saves" = "0.1"
"org.dreamweave.nif" = "0.1"
"org.dreamweave.dream-archive" = "2"
"org.dreamweave.dream-archivetool" = "0.1"
"org.dreamweave.vfs" = "2"
"org.dreamweave.vfstool" = "2.1"
"org.dreamweave.openmw-config" = "4.2"
"org.dreamweave.openmw-install" = "0.1"
"org.dreamweave.dream-ini" = "0.1"
"org.dreamweave.openmw-import-morrowind" = "0.1"
"org.dreamweave.merge-to-master" = "0.1"
"org.dreamweave.add-vanilla-refs" = "0.1"
"org.dreamweave.starwind" = "0.1"
"org.dreamweave.openmw-content" = "0.1"
"org.dreamweave.nif-assets" = "0.1.1"
"org.dreamweave.plugin-assets" = "0.1"
"org.dreamweave.s3lightfixes" = "1.1"
"org.dreamweave.merged-lands" = "0.1.1"
"org.dreamweave.tes3merge" = "0.1.1"
"org.dreamweave.doctor" = "0.1.1"
"org.dreamweave.dreamwind-sql" = "0.2"
"org.dreamweave.openmw-workbench" = "0.7.1"

[modules]
"@dreamwind" = "src/init.jsl"

# The module is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. It requires a tool only when that tool is named, and the layer
# requires each one it can name.

[[layer]]
id = "dreamwind.core"
requires = [
  "vfstool.core",
  "starwind.core",
  "s3lightfixes.core",
  "merged-lands.core",
  "tes3merge.core",
  "doctor.core",
  "tes3cmd.core",
  "tes3conv.core",
  "merge-to-master.core",
  "add-vanilla-refs.core",
  "plugin-assets.core",
  "nif-assets.core",
  "dream-archivetool.core",
  "openmw-import-morrowind.core",
  "tes3-saves.core",
  "dream.sql.commands",
  "openmw.workbench.commands",
]
exports = ["@dreamwind"]

# The command line itself: `src/main.jsl` hands its arguments to `@dreamwind`. It can do what the
# tools it dispatches to can, so its capabilities are the union of what their own targets declare,
# each in its own manifest. `vfstool` declares all four below; `s3lightfixes`, `merged-lands`,
# `tes3merge`, `doctor`, and `tes3-saves` declare filesystem.read, filesystem.write, and
# process.environment; `dreamwind-sql` filesystem.read, process.environment, and process.stdio;
# `openmw-workbench` filesystem.read and process.stdio; `plugin-assets` filesystem.read alone; and
# the rest filesystem.read and filesystem.write.
[targets.dreamwind]
kind = "command"
command = "dreamwind"
entry = "src/main.jsl"
capabilities = ["filesystem.read", "filesystem.write", "process.environment", "process.spawn", "process.stdio"]
