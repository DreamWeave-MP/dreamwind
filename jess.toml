manifest_version = 1

[package]
id = "org.dreamweave.dreamwind"
version = "0.1.1"
jess_api = "1"
include = ["src"]
tests = [
    "tests/archive/run.luau",
    "tests/archive/tool.luau",
    "tests/vfs/run.luau",
    "tests/tes3/run.luau",
]

[modules]
"@dreamwind/archive" = "src/archive/init.luau"
"@dreamwind/archive/ba2" = "src/archive/ba2.luau"
"@dreamwind/archive/bsa" = "src/archive/bsa/init.luau"
"@dreamwind/archive/bsa/tes3" = "src/archive/bsa/tes3.luau"
"@dreamwind/archive/bsa/tes4" = "src/archive/bsa/tes4.luau"
"@dreamwind/archive/tool" = "src/archive/tool.luau"
"@dreamwind/vfs" = "src/vfs/init.luau"
"@dreamwind/tes3" = "src/tes3/init.luau"
"@dreamwind/nif" = "src/nif/init.luau"
"@dreamwind/nif/check" = "src/nif/internal/check.luau"
"@dreamwind/nif/fix" = "src/nif/internal/fix.luau"
"@dreamwind/nif/gamebryo" = "src/nif/internal/gamebryo/reader.luau"
"@dreamwind/nif/header" = "src/nif/internal/header.luau"
"@dreamwind/nif/info" = "src/nif/internal/info.luau"
"@dreamwind/nif/scene" = "src/nif/internal/scene.luau"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. No layer has entrypoints yet, so none requires a capability.

[[layer]]
id = "dream.tes3"
exports = ["@dreamwind/tes3"]

[[layer]]
id = "dream.bethesda-archives"
exports = [
    "@dreamwind/archive",
    "@dreamwind/archive/ba2",
    "@dreamwind/archive/bsa",
    "@dreamwind/archive/bsa/tes3",
    "@dreamwind/archive/bsa/tes4",
    "@dreamwind/archive/tool",
]

[[layer]]
id = "dream.vfs"
requires = ["dream.bethesda-archives"]
exports = ["@dreamwind/vfs"]

[[layer]]
id = "dream.nif"
exports = [
    "@dreamwind/nif",
    "@dreamwind/nif/check",
    "@dreamwind/nif/fix",
    "@dreamwind/nif/gamebryo",
    "@dreamwind/nif/header",
    "@dreamwind/nif/info",
    "@dreamwind/nif/scene",
]
